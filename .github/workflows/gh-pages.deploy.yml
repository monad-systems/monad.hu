name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual rebuild, e.g. after changing a repository secret the build reads
  # (NEXT_PUBLIC_*), which a push would otherwise be needed to pick up.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Get files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install packages
        run: npm ci
      - name: Build project
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ secrets.NEXT_PUBLIC_CONTACT_API_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
        run: npm run build
      - name: Canonicalize English paths
        run: node scripts/generate-en-redirects.mjs
      - name: Generate sitemap, RSS feed and llms.txt
        run: node scripts/generate-sitemap-and-feed.mjs
      - name: Add .nojekyll file
        run: touch ./out/.nojekyll
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: out
      # The IndexNow key is public by design: the protocol verifies it by
      # fetching public/<key>.txt from the site. A failed ping never fails the
      # deploy.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: bfecd5ab327f5197cf8898da2f63d9fb
        run: node scripts/ping-indexnow.mjs

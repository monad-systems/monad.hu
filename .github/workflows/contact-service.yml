name: Contact service

on:
  pull_request:
    paths:
      - 'services/contact/**'
      - '.github/workflows/contact-service.yml'
  push:
    branches: [main]
    paths:
      - 'services/contact/**'
      - '.github/workflows/contact-service.yml'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/monad-systems/monad-systems-contact

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # @monad-systems/altcha is a restricted GitHub Package. This repository
      # needs read access to it (package settings -> Manage Actions access).
      packages: read
    defaults:
      run:
        working-directory: services/contact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/contact
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
